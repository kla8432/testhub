<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บัญชีผู้ใช้ · TestHub</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><section class="auth-card wide"><a href="./">← กลับหน้าเว็บ</a><h1>จัดการบัญชีผู้ใช้</h1><p class="muted">ผู้ดูแลเพิ่มทะเบียนอะไหล่และสร้างบัญชีได้ · ช่างบันทึกงานและเบิกของได้ · ผู้ดูดูข้อมูลได้อย่างเดียว</p><div class="panel" id="user-list"></div><form id="user-form"><label>ชื่อผู้ใช้<input name="username" required pattern="[a-zA-Z0-9._-]{3,50}" autocomplete="off"></label><label>ชื่อแสดงผล<input name="name" required></label><label>รหัสผ่านอย่างน้อย 12 ตัวอักษร<input name="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><label>สิทธิ์<select name="role"><option value="technician">ช่าง</option><option value="viewer">ดูข้อมูล</option><option value="admin">ผู้ดูแลระบบ</option></select></label><p id="user-message" role="status"></p><button>เพิ่มผู้ใช้</button></form></section><script src="config.js"></script><script src="cloud-client.js"></script><script src="users.js"></script></body></html>
