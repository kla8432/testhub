<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ · TestHub</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><section class="auth-card"><div class="eyebrow">TESTHUB / SHARED WORKSPACE</div><h1 id="login-title">เข้าสู่ระบบ</h1><p id="login-hint" class="muted">ใช้บัญชีที่ผู้ดูแลระบบสร้างให้</p><form id="login-form"><label>ชื่อผู้ใช้<input name="username" autocomplete="username" required pattern="[a-zA-Z0-9._-]{3,50}"></label><label id="name-field" hidden>ชื่อแสดงผล<input name="name" autocomplete="name"></label><label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128"></label><p id="login-error" role="alert"></p><button id="login-submit">เข้าสู่ระบบ</button></form></section><script src="config.js"></script><script src="cloud-client.js"></script><script src="login.js"></script></body></html>
